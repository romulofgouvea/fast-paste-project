name: Release

# Dispara ao empurrar uma tag "v*" (ex.: v0.1.6). Confere se a versão bate com a
# tag, builda o app nas três plataformas e publica os instaladores
# (.msi/.exe, .dmg, .deb/.rpm/.AppImage) como assets de uma release do GitHub
# criada automaticamente a partir da tag.
#
# Você NÃO cria a Release à mão — o push da tag v* faz tudo:
#   npm version patch   # ou: edite package.json, src-tauri/tauri.conf.json e Cargo.toml
#   git push && git push --tags
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Conferir versão x tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          PKG=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          fail=0
          for pair in "package.json:$PKG" "tauri.conf.json:$CONF" "Cargo.toml:$CARGO"; do
            name=${pair%%:*}; ver=${pair#*:}
            if [ "$ver" != "$TAG" ]; then
              echo "::error::$name ($ver) não bate com a tag ($TAG). Alinhe a versão antes de publicar."
              fail=1
            fi
          done
          [ "$fail" = 0 ]

  # Auditoria de dependências: não bloqueia a release (advisories de crates
  # transitivas do Tauri/GTK podem aparecer sem correção disponível), mas fica
  # visível no log de cada tag.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: npm audit (produção)
        run: npm audit --omit=dev

      - name: cargo audit
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock

  release:
    needs: check
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Instalar dependências de sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libclang-dev \
            perl \
            xz-utils

      - name: Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache do Cargo
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Build e publicação (tauri-action)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "FPaste ${{ github.ref_name }}"
          releaseBody: "Build automático gerado pela tag ${{ github.ref_name }}. Baixe o instalador correspondente ao seu sistema abaixo. Veja o CHANGELOG.md para as mudanças desta versão."
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
